 const q=norm($('in').value.trim());const L=$('list');L.innerHTML='';sel=-1;
 if(!q){L.style.display='none';return}
 const m=CH.filter(c=>!guesses.includes(c)&&norm(c.n).includes(q)).sort((a,b)=>norm(a.n).startsWith(q)?-1:norm(b.n).startsWith(q)?1:0).slice(0,8);
 m.forEach(c=>{d.appendChild(av(c));d.appendChild(document.createTextNode(c.n));d.onmousedown=e=>{e.preventDefault();guess(c)};L.appendChild(d)});
 L.style.display=m.length?'block':'none';
}
$('in').addEventListener('input',show);
$('in').addEventListener('keydown',e=>{
 const it=[...$('list').children];if(!it.length)return;
 if(e.key==='ArrowDown'){sel=(sel+1)%it.length;e.preventDefault()}
 else if(e.key==='ArrowUp'){sel=(sel-1+it.length)%it.length;e.preventDefault()}
 else if(e.key==='Enter'){const t=it[sel<0?0:sel];const c=CH.find(x=>x.n===t.textContent);if(c)guess(c);return}
 else return;
 it.forEach((d,i)=>d.classList.toggle('on',i===sel));
});
$('in').addEventListener('blur',()=>setTimeout(()=>$('list').style.display='none',100));
$('daily').onclick=daily;
$('rand').onclick=()=>{DLY=false;start(CH[Math.floor(Math.random()*CH.length)])};
$('give').onclick=()=>{if(!done){done=true;$('in').disabled=true;$('msg').textContent='O campeão era '+target.n+'.';hint()}};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{M=b.dataset.m;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));daily()});
daily();
const pad=n=>String(n).padStart(2,'0');
function tick(){const e=new Date(),n=new Date(e);n.setHours(24,0,0,0);const s=Math.floor((n-e)/1000);$('nx').textContent='⏳ Próximo desafio em '+pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);$('tot').textContent=' · '+CH.length+' campeões'}
tick();setInterval(tick,1000);
</script>
</body>
</html>
